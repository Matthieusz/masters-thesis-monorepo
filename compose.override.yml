services:
  db:
    restart: "no"

  adminer:
    restart: "no"

  backend:
    restart: "no"
    command:
      - fastapi
      - run
      - --reload
      - "src/app/main.py"
    develop:
      watch:
        - path: ./apps/api
          action: sync
          target: /app/apps/api
          ignore:
            - ./apps/api/.venv
            - .venv
        - path: ./apps/api/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./apps/api/htmlcov:/app/apps/api/htmlcov
    environment:
      EMAILS_FROM_EMAIL: "noreply@example.com"

  frontend:
    restart: "no"

  playwright:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - CI=${CI:-}
    volumes:
      - ./apps/web/blob-report:/app/apps/web/blob-report
      - ./apps/web/test-results:/app/apps/web/test-results
    ports:
      - "9323:9323"
